name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ matrix.php }}-

      - name: Validate composer.json
        run: composer validate --no-check-publish --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Rector (dry run)
        run: composer check

      - name: Run PHPStan
        run: composer analyse

      - name: Run tests
        run: composer test

  coverage:
    name: Coverage and mutations (PHP 8.2)
    runs-on: ubuntu-latest
    needs: tests

    # Coveralls creates a check run for the uploaded report.
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-8.2-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-8.2-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        id: coverage
        run: composer test-coverage-clover

      - name: Run mutation tests
        run: composer test-mutate -- --min-msi=95

      # The action uses the built-in GitHub credentials by default,
      # and detects the Clover XML format of coverage.xml by its content.
      - name: Upload coverage to Coveralls
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        continue-on-error: true
        uses: coverallsapp/github-action@v2
        with:
          path-to-lcov: coverage.xml

      - name: Upload coverage artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload mutation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: |
            .infection/infection.log
            .infection/infection.json
            .infection/summary.log
          include-hidden-files: true
          if-no-files-found: ignore
